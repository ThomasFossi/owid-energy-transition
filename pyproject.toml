[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_transition"
version = "0.1.0"
description = "Empirical analysis and scenario forecasting of global energy transitions using OWID data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]